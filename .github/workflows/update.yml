name: Actualizar videoclub

on:
  schedule:
    - cron: "17 */3 * * *"   # cada 3 horas
  workflow_dispatch:          # botón "Run workflow" manual
  push:
    paths:
      - "data/**"             # al subir CSV nuevos
      - "overrides.json"
      - "scripts/update.py"

permissions:
  contents: write

concurrency:
  group: update-videoclub
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Fusionar CSV + RSS + TMDB
        env:
          TMDB_API_KEY: ${{ secrets.TMDB_API_KEY }}
          LETTERBOXD_USER: aa33_uni
        run: python scripts/update.py

      - name: Guardar cambios
        run: |
          if git diff --quiet -- movies.json; then
            echo "Sin cambios."
          else
            git config user.name "videoclub-bot"
            git config user.email "videoclub-bot@users.noreply.github.com"
            git add movies.json
            git commit -m "Actualizar catálogo"
            git push
          fi
